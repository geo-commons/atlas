tags:
  postgresql: true

replicaCount: 1

image:
  repository: registry.gitlab.com/purmerend/atlas
  tag: ""
  pullPolicy: IfNotPresent

podAnnotations: { }

debug: false
secretKey: something-secret
allowedHosts: atlas.example.com

internalIps: ""
adminIps: ""

dbHost: atlas-postgresql
dbUser: atlas
dbPassword: change-to-something-secret
dbName: atlas

loadDemoData: false

environment: production

existingSecret: null # Refer to existing secret to avoid managing secrets through Helm

smartstreetUser: ""
smartstreetPassword: ""
smartstreetApiKey: ""

googleMapsApiKey: ""

sentryDsn: ""

matomoUrl: ""
matomoSiteId: ""

authenticationEnableCredentials: true
authenticationEnableOidc: false

oidcClientId: atlas
oidcClientSecret: somethingsecret
oidcSignAlgo: RS256
oidcScopes: openid email profile
oidcAuthorizationEndpoint: http://localhost:6556/auth
oidcTokenEndpoint: http://localhost:6556/token
oidcUserEndpoint: http://localhost:6556/userinfo
oidcJwksEndpoint: http://localhost:6556/keys
oidcUsernameClaim: sub
oidcActivateOnCreate: true
oidcSyncGroups: false

showLayersOnlyWhenAccessible: false

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  fsGroup: 33

securityContext: { }

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  annotations:
    { }
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: atlas.example.com
      paths:
        - path: /atlas
          pathType: ImplementationSpecific
  tls: [ ]
  #   - secretName: atlas-tls
  #     hosts:
  #       - atlas.example.com

resources: { }

nodeSelector: { }

tolerations: [ ]

affinity: { }

persistence:
  media:
    enabled: true
    size: 1Gi
    existingClaim: null
    accessModes:
      - ReadWriteOnce
    storageClassName: "local-path"

#########################
## PostgreSQL subchart ##
#########################
postgresql:
  image:
    repository: bitnamilegacy/postgresql
    tag: 17.5.0-debian-12-r9

  auth:
    username: atlas
    password: change-to-something-secret
    database: atlas

#########################
## Geoserver subchart  ##
#########################
geoserver:
  enabled: false
  image:
    tag: "2.27.3-1"
  persistence:
    accessModes:
      - ReadWriteOnce
  ingress:
    enabled: true
    className: ""
    annotations:
      {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /geoserver
            pathType: ImplementationSpecific
    tls: []