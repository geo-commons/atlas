Lint and unit test backend:
  stage: Test
  image: python:3.13
  services:
    - postgres:18.0-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: postgres
    DB_PASSWORD: postgres
    DB_USER: postgres
    DJANGO_SETTINGS_MODULE: atlas.settings
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_PASSWORD: postgres
    SECRET_KEY: somethingverysecret
  cache:
    paths:
      - $CI_PROJECT_DIR/.cache/pip
  before_script:
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
  script:
    - ruff check
    - python -m coverage run manage.py test
    - python -m coverage report && python -m coverage html
  coverage: "/TOTAL.+ ([0-9]{1,3}%)/"
  artifacts:
    expire_in: 1 month
    paths:
      - htmlcov

Test migrations backend:
  stage: Test
  image: python:3.13
  services:
    - postgres:18.0-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: postgres
    DB_PASSWORD: postgres
    DB_USER: postgres
    DJANGO_SETTINGS_MODULE: atlas.settings
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_PASSWORD: postgres
    SECRET_KEY: somethingverysecret
  cache:
    paths:
      - $CI_PROJECT_DIR/.cache/pip
  before_script:
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
  script:
    - python manage.py makemigrations --check --dry-run
    - python manage.py migrate

Lint ui:
  stage: Test
  image: node:22.19.0-alpine
  cache:
    paths:
      - ui/node_modules/
  before_script:
    - cd ui/
    - npm install
  script:
    - npm run lint

Unit test frontend:
  stage: Test
  image: node:22.19.0-alpine
  cache:
    paths:
      - ui/node_modules/
  before_script:
    - cd ui/
    - npm install
  script:
    - npm run test:unit

Browser test frontend:
  stage: Test
  image: mcr.microsoft.com/playwright:v1.58.1-noble
  cache:
    paths:
      - ui/node_modules/
  before_script:
    - cd ui/
    - npm install
  script:
    - npm run test:browser

E2E test frontend (Playwright):
  stage: Test
  image: mcr.microsoft.com/playwright:v1.58.1-noble
  services:
    - postgres:18.0-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: postgres
    DB_PASSWORD: postgres
    DB_USER: postgres
    DJANGO_SETTINGS_MODULE: atlas.settings
    POSTGRES_PASSWORD: postgres
    SECRET_KEY: somethingverysecret
    DEBUG: "False"
    E2E_BASE_URL: "http://127.0.0.1:8000"
    PW_SKIP_WEBSERVER: "1"
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    paths:
      - ui/node_modules/
      - $CI_PROJECT_DIR/.cache/pip
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3-venv
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements_e2e.txt
    - cd ui/
    - npm ci
    - npm run build
    - cd ..
    - .venv/bin/python manage.py migrate
    - .venv/bin/python manage.py loaddata data/demo.json
    - .venv/bin/python manage.py collectstatic --noinput
  script:
    - .venv/bin/python manage.py runserver 127.0.0.1:8000 --insecure &
    - until curl -sSf http://127.0.0.1:8000/atlas/ >/dev/null; do sleep 1; done
    - cd ui/
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ui/playwright-report/
      - ui/test-results/
