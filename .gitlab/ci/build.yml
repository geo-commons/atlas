Build:
  stage: Build
  image: docker:24.0.2-git
  services:
    - docker:24.0.2-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - export ATLAS_VERSION=$(git describe --tags)
    - docker build --cache-from "$CI_REGISTRY_IMAGE:latest" --build-arg ATLAS_VERSION="$ATLAS_VERSION" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
