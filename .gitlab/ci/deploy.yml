Deploy Review App:
  stage: Deploy
  image: registry.gitlab.com/commonground/core/review-app-deployer:latest
  script:
    - |
      echo $CI_MERGE_REQUEST_LABELS
      kubectl config get-contexts
      kubectl config use-context purmerend/atlas:review
      cd helm/
      helm dependency update
      helm upgrade --install atlas-$CI_ENVIRONMENT_SLUG . \
      --namespace atlas-$CI_ENVIRONMENT_SLUG \
      --create-namespace \
      --set image.repository=$CI_REGISTRY_IMAGE \
      --set image.tag=$CI_COMMIT_SHA \
      --set allowedHosts=atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN \
      --set secretKey=$SECRET_KEY \
      --set dbHost=atlas-$CI_ENVIRONMENT_SLUG-postgresql \
      --set ingress.hosts[0].host=atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN \
      --set ingress.hosts[0].paths[0].path=/ \
      --set ingress.hosts[0].paths[0].pathType=ImplementationSpecific \
      --set persistence.media.storageClassName=standard-retain \
      --set smartstreetUser=$SMARTSTREET_USER \
      --set smartstreetPassword=$SMARTSTREET_PASSWORD \
      --set smartstreetApiKey=$SMARTSTREET_API_KEY \
      --set googleMapsApiKey=$GOOGLE_MAPS_API_KEY
  when: manual
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN/atlas/
    on_stop: Remove Review App
    auto_stop_in: 1 week
  only:
    - branches@purmerend/atlas
  except:
    - master@purmerend/atlas

Remove Review App:
  stage: Deploy
  image: registry.gitlab.com/commonground/core/review-app-deployer:latest
  variables:
    GIT_STRATEGY: none
  script: |
    kubectl config get-contexts
    kubectl config use-context purmerend/atlas:review
    kubectl delete namespace atlas-$CI_ENVIRONMENT_SLUG
  when: manual
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN/atlas/
    action: stop
  only:
    - branches@purmerend/atlas
  except:
    - master@purmerend/atlas

Deploy Docker latest tag:
  stage: Deploy
  image: docker:24.0.2
  services:
    - docker:24.0.2-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

Deploy Docker version tag:
  stage: Deploy
  image: docker:24.0.2-git
  services:
    - docker:24.0.2-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - export ATLAS_VERSION=$(git describe --tags)
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:$ATLAS_VERSION
    - docker push $CI_REGISTRY_IMAGE:$ATLAS_VERSION
  only:
    - tags

Deploy acceptance:
  stage: Deploy
  image: registry.gitlab.com/commonground/core/review-app-deployer:latest
  script:
    - |
      kubectl config get-contexts
      kubectl config use-context purmerend/atlas:review
      cd helm/
      helm dependency update
      helm upgrade --install atlas-acc . \
      --namespace atlas-acc \
      --create-namespace \
      --set image.repository=$CI_REGISTRY_IMAGE \
      --set image.tag=$CI_COMMIT_SHA \
      --set allowedHosts=atlas-acc.$REVIEW_BASE_DOMAIN \
      --set secretKey=$SECRET_KEY \
      --set dbHost=atlas-acc-postgresql \
      --set ingress.hosts[0].host=atlas-acc.$REVIEW_BASE_DOMAIN \
      --set ingress.hosts[0].paths[0].path=/ \
      --set ingress.hosts[0].paths[0].pathType=ImplementationSpecific \
      --set persistence.media.storageClassName=standard-retain \
      --set smartstreetUser=$SMARTSTREET_USER \
      --set smartstreetPassword=$SMARTSTREET_PASSWORD \
      --set smartstreetApiKey=$SMARTSTREET_API_KEY \
      --set googleMapsApiKey=$GOOGLE_MAPS_API_KEY
  environment:
    name: review/acc
    url: https://atlas-acc.$REVIEW_BASE_DOMAIN/atlas/
  only:
    - master@purmerend/atlas

Upload helm chart:
  stage: Deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]

  script:
    - cd helm
    - helm repo add helm https://charts.helm.sh/stable
    - helm dependency build
    - helm package .
    - FILENAME=$(echo atlas-*.tgz)
    - curl --request POST --user gitlab-ci-token:$CI_JOB_TOKEN --form "chart=@${FILENAME}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
  when: manual
