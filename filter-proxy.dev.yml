listenAddress: :8050

authorizationServiceUrl: http://host.docker.internal:8000/atlas/api/v1/authorize/

cors:
  allowedOrigins:
    - http://host.docker.internal:8000
    - http://localhost:8000
  allowedHeaders:
    - Accept
    - Authorization
    - Content-Type
    - X-Requested-With
  allowCredentials: true
  allowPrivateNetwork: true
  debugLogging: true

paths:
  - path: /api/ows
    backend:
      slug: geoserver
      path: /ows
    allowedMethods:
      - GET
      - POST
  - path: /api/kvk/zoeken
    backend:
      slug: kvk
      path: /zoeken
  - path: /api/dso/_zoek
    backend:
      slug: dso
      path: /_zoek
    allowedMethods:
      - POST
    requestRewrite: |
      {
          "geometrie": {
              "type": "Point",
              "coordinates": [
                  .latitude,
                  .longitude
              ]
          }
      }
  - path: /api/dso/{uriIdentificatie}
    backend:
      slug: dso
      path: /{uriIdentificatie}
    allowedMethods:
      - GET
  - path: /api/kvk/v1/basisprofielen/{kvkNummer:[0-9]+}
    backend:
      slug: kvkv1
      path: /basisprofielen/{kvkNummer:[0-9]+}
  - path: /api/kvk/v1/basisprofielen/{kvkNummer:[0-9]+}/eigenaar
    backend:
      slug: kvkv1
      path: /basisprofielen/{kvkNummer:[0-9]+}/eigenaar
  - path: /api/kvk/v1/basisprofielen/{kvkNummer:[0-9]+}/hoofdvestiging
    backend:
      slug: kvkv1
      path: /basisprofielen/{kvkNummer:[0-9]+}/hoofdvestiging
  - path: /api/kvk/v1/basisprofielen/{kvkNummer:[0-9]+}/vestigingen
    backend:
      slug: kvkv1
      path: /basisprofielen/{kvkNummer:[0-9]+}/vestigingen
  - path: /api/kvk/v1/vestigingsprofielen/{vestigingsnummer:[0-9]+}
    backend:
      slug: kvkv1
      path: /vestigingsprofielen/{vestigingsnummer:[0-9]+}

backends:
  geoserver:
    type: OWS
    baseUrl: http://host.docker.internal:8080/geoserver
    auth:
      basic:
        username: filter-proxy
        password: password
  kvk:
    type: REST
    baseUrl: https://api.kvk.nl/test/api/v2
    auth:
      header:
        apikey: l7xx1f2691f2520d487b902f4e0b57a0b197
  kvkv1:
    type: REST
    baseUrl: https://api.kvk.nl/test/api/v1
    auth:
      header:
        apikey: l7xx1f2691f2520d487b902f4e0b57a0b197
  dso:
    type: REST
    baseUrl: https://service.omgevingswet.overheid.nl/publiek/omgevingsinformatie/api/ontsluiten/v2/documenten
    auth:
      header:
        x-api-key: ${DSO_API_KEY}
        content-crs: http://www.opengis.net/def/crs/EPSG/0/28992
        content-type: application/json
