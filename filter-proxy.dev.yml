listenAddress: :8050

authorizationServiceUrl: http://host.docker.internal:8000/atlas/api/v1/authorize/

cors:
  allowedOrigins:
    - http://localhost:8000
  allowedHeaders:
    - Accept
    - Authorization
    - Content-Type
    - X-Requested-With
  allowCredentials: true
  allowPrivateNetwork: true
  debugLogging: true

paths:
  - path: /api/ows
    backend:
      slug: filter-proxy-lokaal
      path: /ows
    allowedMethods:
      - GET
      - POST

backends:
  geoserver:
    type: OWS
    baseUrl: https://dpt.purmerend.nl/geoserver
  filter-proxy-lokaal:
    type: OWS
    baseUrl: http://geoserver:8080/geoserver
