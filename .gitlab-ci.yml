stages:
  - Test
  - Build
  - Deploy

variables:
  REVIEW_BASE_DOMAIN: delta10-review.nl
  FF_NETWORK_PER_BUILD: "true"

Test:
  stage: Test
  image: python:3.10
  services:
    - postgres:11.14-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: postgres
    DB_PASSWORD: postgres
    DB_USER: postgres
    DJANGO_SETTINGS_MODULE: atlas.settings
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_PASSWORD: postgres
    SECRET_KEY: somethingverysecret
  cache:
    paths:
      - $CI_PROJECT_DIR/.cache/pip
  before_script:
    - pip install -r requirements.txt
    - python manage.py collectstatic --noinput
  script:
    - python -m prospector -X
    - python -m coverage run manage.py test
    - python -m coverage report && python -m coverage html
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    expire_in: 1 month
    paths:
      - htmlcov

Lint ui:
  stage: Test
  image: node:14.18.2-alpine
  cache:
    paths:
      - ui/node_modules/
  before_script:
    - cd ui/
    - npm install
  script:
    - npm run lint

Build:
  stage: Build
  image: docker:20.10.11-git
  services:
    - docker:20.10.11-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - export ATLAS_VERSION=$(git describe --tags)
    - docker build --build-arg ATLAS_VERSION=$ATLAS_VERSION -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

Deploy Review App:
  stage: Deploy
  image: registry.gitlab.com/commonground/core/review-app-deployer:latest
  script:
    - |
      cd helm/
      helm dependency update
      helm upgrade --install atlas-$CI_ENVIRONMENT_SLUG . \
      --set image.repository=$CI_REGISTRY_IMAGE \
      --set image.tag=$CI_COMMIT_SHA \
      --set allowedHosts=atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN \
      --set secretKey=somethingsecret \
      --set dbHost=atlas-$CI_ENVIRONMENT_SLUG-postgresql \
      --set postgresql.persistence.enabled=false \
      --set loadDemoData=true \
      --set ingress.hosts[0]=atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN/atlas/
    on_stop: Remove Review App
    auto_stop_in: 1 week
  only:
    - branches@purmerend/atlas
  except:
    - master@purmerend/atlas
    - /^renovate/.*$/@purmerend/atlas

Remove Review App:
  stage: Deploy
  image: registry.gitlab.com/commonground/core/review-app-deployer:latest
  variables:
    GIT_STRATEGY: none
  script:
    - helm uninstall atlas-$CI_ENVIRONMENT_SLUG
  when: manual
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://atlas-$CI_ENVIRONMENT_SLUG.$REVIEW_BASE_DOMAIN/atlas/
    action: stop
  only:
    - branches@purmerend/atlas
  except:
    - master@purmerend/atlas
    - /^renovate/.*$/@purmerend/atlas

Deploy Docker latest tag:
  stage: Deploy
  image: docker:20.10.11
  services:
    - docker:20.10.11-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

Deploy Docker version tag:
  stage: Deploy
  image: docker:20.10.11-git
  services:
    - docker:20.10.11-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - export ATLAS_VERSION=$(git describe --tags)
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:$ATLAS_VERSION
    - docker push $CI_REGISTRY_IMAGE:$ATLAS_VERSION
  only:
    - tags

Deploy acceptance:
  stage: Deploy
  image: registry.gitlab.com/commonground/core/review-app-deployer:latest
  script:
    - |
      cd helm/
      helm dependency update
      helm upgrade --install atlas-acc . \
      --set image.repository=$CI_REGISTRY_IMAGE \
      --set image.tag=$CI_COMMIT_SHA \
      --set allowedHosts=atlas-acc.$REVIEW_BASE_DOMAIN \
      --set secretKey=$SECRET_KEY \
      --set dbHost=atlas-acc-postgresql \
      --set ingress.hosts[0]=atlas-acc.$REVIEW_BASE_DOMAIN \
      --set smartstreetUser=$SMARTSTREET_USER \
      --set smartstreetPassword=$SMARTSTREET_PASSWORD \
      --set smartstreetApiKey=$SMARTSTREET_API_KEY \
      --set googleMapsApiKey=$GOOGLE_MAPS_API_KEY \
      --set ctrixIps=$CTRIX_IPS
  environment:
    name: review/acc
    url: https://atlas-acc.$REVIEW_BASE_DOMAIN/atlas/
  only:
    - master@purmerend/atlas
