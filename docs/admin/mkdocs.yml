site_name: Atlas Admin Documentatie
site_url: https://documentatie.atlas.nl
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  language: nl
  palette:
    primary: custom
  features:
    - navigation.footer
extra:
  generator: false
plugins:
  - search
markdown_extensions:
  - smarty
  - toc:
      separator: "-"
nav:
  - Home: 'index.md'
  - 'Aan de slag': 'schermuitleg.md'
  - 'Functies': 'help.md'
  - 'Gebruikte termen': 'gebruiktetermen.md'
  - 'Afkortingen': 'afkortingen.md'
