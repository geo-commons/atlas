name: Tests

on:
  push:
    branches: ["main"]
    tags: ["*.*.*"]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend_test_and_lint:
    name: Backend tests, migration check and linting
    runs-on: ubuntu-latest
    if: false
    env:
      DB_HOST: localhost
      DB_NAME: postgres
      DB_PASSWORD: postgres
      DB_USER: postgres
      DJANGO_SETTINGS_MODULE: atlas.settings
      POSTGRES_PASSWORD: postgres
      SECRET_KEY: somethingverysecret
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Collect static files
        run: uv run manage.py collectstatic --noinput
      - name: Check for missing migrations
        run: uv run manage.py makemigrations --dry-run --check
      - name: Run ruff
        run: uv run ruff check
      - name: Run tests with coverage
        run: |
          uv run coverage run manage.py test
          uv run coverage report && uv run coverage xml
      - name: Report on coverage
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend_lint:
    name: Frontend linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: "ui/package.json"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm run lint

  frontend_unit_tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    if: false
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: "ui/package.json"
          cache-dependency-path: "ui/pnpm-lock.yaml"
          cache: "pnpm"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm run test:unit

  frontend_browser_tests:
    name: Frontend browser tests
    runs-on: ubuntu-latest
    if: false
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: "ui/package.json"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps
      - name: Run tests
        run: pnpm run test:browser

  e2e_tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    if: false
    env:
      DB_HOST: localhost
      DB_NAME: postgres
      DB_PASSWORD: postgres
      DB_USER: postgres
      DJANGO_SETTINGS_MODULE: atlas.settings
      POSTGRES_PASSWORD: postgres
      SECRET_KEY: somethingverysecret
      DEBUG: "False"
      E2E_BASE_URL: "http://127.0.0.1:8000"
      PW_SKIP_WEBSERVER: "1"
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
      - name: Install backend dependencies
        run: uv sync --locked
      - name: Collect static files
        run: uv run manage.py collectstatic --noinput
      - name: Prepare backend
        run: |
          uv run manage.py migrate
          uv run manage.py loaddata data/demo.json
          uv run manage.py collectstatic --noinput
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version-file: "ui/package.json"
      - name: Install frontend dependencies
        run: |
          cd ui
          corepack enable
          pnpm install --frozen-lockfile
          mkdir -p $PLAYWRIGHT_BROWSERS_PATH
          pnpm exec playwright install --with-deps
      - name: Build frontend
        run: |
          cd ui
          pnpm run build
      - name: Run tests
        run: |
          uv run manage.py runserver 127.0.0.1:8000 --insecure &
          cd ui
          until curl -sSf http://127.0.0.1:8000/atlas/ >/dev/null; do sleep 1; done
          pnpm run test:e2e
