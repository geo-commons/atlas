{% load render_bundle from webpack_loader %}
{% load static %}
<!DOCTYPE html>
<html lang="nl">
  <head>
    <title>{% if title %}{{ title }} · {% endif %}Atlas · {{ config.ORGANIZATION_NAME }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" >

    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    <link rel="shortcut icon" href="{% if config.FAVICON_URL %}{{ config.FAVICON_URL }}{% else %}{% static 'img/favicon.ico' %}{% endif %}" />
</head>
  <body>
    {% block content %}{% endblock %}
    {% render_bundle "app" %}
    {% render_bundle "map" %}

    {% if google_maps %}
      <script async defer src="https://maps.googleapis.com/maps/api/js?key={{ google_maps.api_key }}"></script>
    {% endif %}

    {% if street_smart %}
      <script type="text/javascript" src="{% static 'vendor/react/16.12.0/react.production.min.js' %}"></script>
      <script type="text/javascript" src="{% static 'vendor/react/16.12.0/react-dom.production.min.js' %}"></script>
      <script type="text/javascript" src="{% static 'vendor/openlayers/4.6.5/ol.js' %}"></script>
      <script type="text/javascript" src="{% static 'vendor/lodash/4.17.15/lodash.min.js' %}"></script>
      <script type="text/javascript" src="https://streetsmart.cyclomedia.com/api/v19.5/StreetSmartApi.js"></script>
    {% endif %}
  </body>
</html>
